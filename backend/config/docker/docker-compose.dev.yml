services:
  postgres:
    image: postgres:16-alpine
    container_name: kubetaskops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kubetaskops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../pkg/store/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kubetaskops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
